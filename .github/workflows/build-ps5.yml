name: Source build check (not for release)

# Compiles the C++ in this repository for the PS5. The repository's C++ is older
# than the released v1.0.2 executable (no online play, per-game FSI, frame
# generation or Kinect), so the eboot.bin made here is only uploaded as a check
# artifact. Releases are made by release-binary.yml from the official package.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ps5:
    name: Compile eboot.bin from source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PS5X360
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang-18 lld-18 llvm-18 cmake ninja-build \
            python3 python3-pip python3-venv python3-mako python3-yaml python3-packaging \
            pkg-config git curl unzip jq rsync wget \
            llvm-18-dev libclang-18-dev libclang-cpp18-dev libclc-18-dev \
            libllvmspirvlib-18-dev llvm-spirv-18 spirv-tools glslang-tools
          # Mesa at the pinned PS5_Mesa revision needs Meson >= 1.4; Ubuntu 24.04 ships 1.3.2.
          pipx install meson==1.7.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Vulkan SDK shader tools
        # Canary's compile_shader_spirv.py runs `spirv-opt --canonicalize-ids`,
        # which Ubuntu 24.04's SPIRV-Tools (2023.6) lacks. Only the three shader
        # tools are put on PATH; VULKAN_SDK stays unset so the PS5 cross build
        # keeps using the RADV headers.
        run: |
          set -euo pipefail
          v=1.4.341.1
          file=vulkansdk-linux-x86_64-$v.tar.xz
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/$file" \
            "https://sdk.lunarg.com/sdk/download/$v/linux/$file"
          echo "3bf0f762afb6c79bc6a9d9fb5998745ccff928800a29619b501ed9de7fd9789b  $RUNNER_TEMP/$file" | sha256sum --check --strict
          mkdir -p "$HOME/vulkan-sdk" "$HOME/shader-tools"
          tar -xJf "$RUNNER_TEMP/$file" -C "$HOME/vulkan-sdk" "$v/x86_64/bin" "$v/x86_64/lib"
          for tool in glslangValidator spirv-opt spirv-dis; do
            ln -sf "$HOME/vulkan-sdk/$v/x86_64/bin/$tool" "$HOME/shader-tools/$tool"
          done
          echo "$HOME/shader-tools" >> "$GITHUB_PATH"
          "$HOME/shader-tools/spirv-opt" --version
          help=$("$HOME/shader-tools/spirv-opt" --help)
          grep -q -- --canonicalize-ids <<< "$help"

      - name: Fetch PS5_Vulkan, PS5_Mesa, and PS5_PayloadSDK references
        # The pinned PS5_Mesa and PS5_PayloadSDK commits are no longer on any
        # branch (their main branches were rewritten), so a plain clone does not
        # contain them. GitHub still serves them when fetched by full SHA.
        run: |
          set -euo pipefail
          fetch_pinned() {
            local name=$1 revision=$2 dir=.deps/references/$1
            git init -q "$dir"
            git -C "$dir" remote add origin "https://github.com/mihawk-99/$name.git"
            git -C "$dir" fetch -q --depth 1 origin "$revision"
            git -C "$dir" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$revision"
          }
          mkdir -p .deps/references
          fetch_pinned PS5_Vulkan 3f3ee69607013b345d2baa6d6a37c86745649a08
          fetch_pinned PS5_Mesa 0b2d6d1a61d9bbf89cf8beb88a696144f67c61f8
          fetch_pinned PS5_PayloadSDK 95c08f27386fc698f6bbe21dde3030140a41d10b
          # zlib.net intermittently serves CI runners something other than the
          # pinned archive. Seed the identical tarball from zlib's GitHub release
          # where setup-native-dependencies.sh looks before downloading; it
          # still checks the same SHA-256.
          zlib_dir=.deps/references/PS5_Vulkan/.deps/native/zlib
          mkdir -p "$zlib_dir"
          curl -fsSL --retry 5 --retry-all-errors -o "$zlib_dir/zlib-1.3.2.tar.gz" \
            https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz
          echo "bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16  $zlib_dir/zlib-1.3.2.tar.gz" | sha256sum --check --strict

      - name: Prepare Xenia Canary Core & Apply PS5 Optimizations
        run: |
          python3 tools/prepare_canary.py

      - name: Build RADV Platform & Payload SDK
        run: |
          mkdir -p build
          bash tools/build-radv-platform.sh

      - name: Build PS5 Title Executable (eboot.bin)
        run: |
          PS5_PAYLOAD_SDK="$(pwd)/.deps/references/PS5_Vulkan/.deps/native/ps5-payload-sdk" \
            bash tools/build-canary-game.sh

      - name: Upload the compiled eboot.bin (not for release)
        uses: actions/upload-artifact@v4
        with:
          name: eboot-source-build-NOT-FOR-RELEASE
          path: build/canary-game/eboot.bin
