name: Source 1.0.2 fix checks

# Host checks of tools/source-1.0.2/fixes on an assembled 1.0.2 tree, without the PS5 build
# (build-source-1.0.2.yml runs them too, before compiling eboot.bin). Runs on pushes that
# change the fixes or their checks.
on:
  push:
    paths:
      - 'tools/source-1.0.2/**'
      - 'tools/check-gdfx-names.*'
      - '.github/workflows/source-1.0.2-fix-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Fix checks on the assembled tree
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PS5X360
        uses: actions/checkout@v4

      - name: Install the host compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 libclang-rt-18-dev git python3

      - name: Restore the source drops
        uses: actions/cache@v4
        with:
          path: .deps/src102-cache
          key: src102-drops-${{ hashFiles('tools/source-1.0.2/assemble.py') }}
          restore-keys: src102-drops-

      - name: Assemble the 1.0.2 source tree
        run: python3 -I tools/source-1.0.2/assemble.py --out build/src102 --cache .deps/src102-cache

      - name: Fix 26, GDFX names in Windows-1252 (Handball 16)
        run: bash tools/check-gdfx-names.sh build/src102
